version: 0.0
os: linux

files:
  - source: target/maven-jenkins-project-1.0-SNAPSHOT.jar
    destination: /opt/maven-app

hooks:
  BeforeInstall:
    - location: scripts/stop_application.sh
      timeout: 60
      runas: root

  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 60
      runas: root
